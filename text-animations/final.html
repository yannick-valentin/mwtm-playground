<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MWTM text animations</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/alte-haas-grotesk" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div class="container">
    <div>
      <div class="row-label">Scanline + progressive reveal</div>
      <div class="title"><span data-scanline-text-reveal>Community Threads</span></div>
      <div class="btns-row">
        <button class="pill-btn"><span data-scanline-text-reveal>CALL TO ACTION</span></button>
        <button class="pill-btn white"><span data-scanline-text-reveal>CALL TO ACTION</span></button>
        <button class="pill-btn black"><span data-scanline-text-reveal>CALL TO ACTION</span></button>
      </div>
    </div>
    <div>
      <div class="row-label">Fisher-Yates</div>

      <div class="title" data-hover-shuffle-full>Community Threads</div>
      <div class="btns-row">
        <button class="pill-btn" data-hover-shuffle-full>CALL TO ACTION</button>
        <button class="pill-btn white" data-hover-shuffle-full>CALL TO ACTION</button>
        <button class="pill-btn black" data-hover-shuffle-full>CALL TO ACTION</button>
      </div>
    </div>
    <div>
      <div class="row-label">Fisher-Yates + progressive reveal</div>

      <div class="title" data-hover-shuffle>Community Threads</div>
      <div class="btns-row">
        <button class="pill-btn" data-hover-shuffle>CALL TO ACTION</button>
        <button class="pill-btn white" data-hover-shuffle>CALL TO ACTION</button>
        <button class="pill-btn black" data-hover-shuffle>CALL TO ACTION</button>
      </div>
    </div>
  </div>

  <script src="assets/script.js"></script>
</body>
</html>
